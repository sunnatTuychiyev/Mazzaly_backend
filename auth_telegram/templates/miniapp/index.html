<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mazzaly Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="error" style="display:none;position:fixed;top:0;left:0;right:0;background:#f44336;color:#fff;padding:8px;z-index:9999"></div>
<div id="app"></div>
<script>
(function(){
  const app = document.getElementById('app');
  const errorBox = document.getElementById('error');
  app.innerHTML = '<p>Loading...</p>';

  const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  function showError(msg){
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
    if(tg && tg.showAlert) tg.showAlert(msg);
  }
  window.addEventListener('error', e=>showError(e.message || 'Error'));
  window.addEventListener('unhandledrejection', e=>showError(e.reason?.message || e.reason || 'Error'));

  if(!tg || !tg.initDataUnsafe || !tg.initDataUnsafe.user){
    app.innerHTML = '<h2>This page is only available via Telegram</h2>';
    return;
  }
  if(tg.ready) tg.ready();
  if(tg.expand) tg.expand();
  const initData = tg.initData || '';
  fetch('/api/auth/telegram/login/', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({init_data: initData})
  }).then(r=>r.json()).then(res=>{
    if(res.access){
      localStorage.setItem('access', res.access);
      window.location.href = '/telegram/recipe-form/';
    } else {
      showError('Auth error');
    }
  }).catch(()=>{
    showError('Auth error');
  });
})();
</script>
</body>
</html>
