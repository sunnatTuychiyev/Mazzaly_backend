<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mazzaly Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #error {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #f44336;
            color: #fff;
            padding: 8px;
            z-index: 9999;
            text-align: center;
        }
        #loading {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>
<div id="error"></div>
<div id="app"><div id="loading">Loading...</div></div>
<script>
(async function(){
  const app = document.getElementById('app');
  const errorBox = document.getElementById('error');
  const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
    if(tg && tg.showAlert) tg.showAlert(msg);
  }
  window.addEventListener('error', e=>showError(e.message || 'Error'));
  window.addEventListener('unhandledrejection', e=>showError(e.reason?.message || e.reason || 'Error'));

  if(tg && tg.ready) tg.ready();
  if(tg && tg.expand) tg.expand();
  try {
    const initData = (tg && tg.initData) ? tg.initData : '';
    const res = await fetch('/api/auth/telegram/login/', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({init_data: initData})
    }).then(r => r.json());
    if(res.access){
      localStorage.setItem('access', res.access);
      window.location.href = '/telegram/recipe-form/';
    } else {
      showError('Auth error');
    }
  } catch (e) {
    showError('Auth error');
  }
})();
</script>
</body>
</html>
