<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Preview</title>
    <link rel="stylesheet" href="https://mazzaly.uz/assets/index-DgEGrTYq.css" crossorigin />
</head>
<body class="min-h-screen bg-white">
    <div class="container px-4 py-8">
        <div class="space-y-6">
            <div class="relative w-full h-[300px] md:h-[400px] rounded-lg overflow-hidden">
                <img id="image" class="w-full h-full object-cover" alt="recipe image" />
                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-6">
                    <div class="flex flex-wrap gap-2 mb-2">
                        <span id="category" class="category-pill bg-recipe-primary/20 text-white hidden"></span>
                    </div>
                    <h1 id="title" class="text-2xl md:text-3xl font-serif font-bold text-white"></h1>
                </div>
            </div>
            <p id="description" class="text-muted-foreground"></p>
            <div class="grid grid-cols-3 gap-4">
                <div class="flex flex-col items-center justify-center p-4 bg-muted rounded-lg">
                    <div class="mb-1 text-recipe-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    </div>
                    <span class="text-xs text-muted-foreground">Tayyorlash vaqti</span>
                    <span id="prep" class="font-medium">0 min</span>
                </div>
                <div class="flex flex-col items-center justify-center p-4 bg-muted rounded-lg">
                    <div class="mb-1 text-recipe-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    </div>
                    <span class="text-xs text-muted-foreground">Pishirish vaqti</span>
                    <span id="cook" class="font-medium">0 min</span>
                </div>
                <div class="flex flex-col items-center justify-center p-4 bg-muted rounded-lg">
                    <div class="mb-1 text-recipe-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                    <span class="text-xs text-muted-foreground">Porsiya</span>
                    <span id="servings" class="font-medium">1</span>
                </div>
            </div>
            <div class="grid md:grid-cols-2 gap-8">
                <div class="rounded-lg border bg-card text-card-foreground shadow-sm">
                    <div class="p-6 pt-6">
                        <div class="flex items-center gap-2 mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-check-big h-5 w-5 text-recipe-primary"><path d="M21 10.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12.5"></path><path d="m9 11 3 3L22 4"></path></svg>
                            <h2 class="text-xl font-serif font-bold">Ingredientlar</h2>
                        </div>
                        <ul id="ingredients" class="space-y-2"></ul>
                    </div>
                </div>
                <div class="rounded-lg border bg-card text-card-foreground shadow-sm">
                    <div class="p-6 pt-6">
                        <div class="flex items-center gap-2 mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book h-5 w-5 text-recipe-primary"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"></path></svg>
                            <h2 class="text-xl font-serif font-bold">Ko'rsatmalar</h2>
                        </div>
                        <ol id="instructions" class="space-y-4"></ol>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const data = JSON.parse(sessionStorage.getItem('previewData') || '{}');
        if (data.imageUrl) {
            document.getElementById('image').src = data.imageUrl;
        }
        document.getElementById('title').textContent = data.name || '';
        document.getElementById('description').textContent = data.description || '';
        if (data.prep_time) {
            document.getElementById('prep').textContent = data.prep_time + ' min';
        }
        if (data.cook_time) {
            document.getElementById('cook').textContent = data.cook_time + ' min';
        }
        if (data.servings) {
            document.getElementById('servings').textContent = data.servings;
        }
        const ingList = document.getElementById('ingredients');
        (data.ingredients || []).forEach((ing, idx) => {
            const li = document.createElement('li');
            li.className = 'flex items-start gap-2';
            li.innerHTML = `<button type="button" class="h-4 w-4 shrink-0 rounded-sm border border-primary mt-1"></button><label>${ing.amount ? `<span class='font-medium'>${ing.amount}</span>` : ''} ${ing.unit || ''} ${ing.name || ''}</label>`;
            ingList.appendChild(li);
        });
        const instrList = document.getElementById('instructions');
        (data.instructions || []).forEach((step, i) => {
            const li = document.createElement('li');
            li.className = 'flex items-start gap-2';
            li.innerHTML = `<button type="button" class="h-4 w-4 shrink-0 rounded-sm border border-primary mt-1"></button><label><div class="flex gap-2"><span class="font-medium bg-muted rounded-full h-6 w-6 flex items-center justify-center text-sm">${i+1}</span><span>${step.description || ''}</span></div></label>`;
            instrList.appendChild(li);
        });
    </script>
</body>
</html>
